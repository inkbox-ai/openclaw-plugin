name: PR checks — typecheck · unit · contract

on:
  push:
    branches: [main]
  pull_request:                     # catches PRs from feature branches → main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Offline unit suite + typecheck against the pinned OpenClaw host from
  # pnpm-lock. Fast signal on our own code — cheap enough to run on every
  # push, including draft PRs (the heavy live suite is what we gate).
  unit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pinned dependencies
        run: |
          npx --yes pnpm@10.28.0 install --frozen-lockfile
          npx --yes pnpm@10.28.0 add --save-dev --lockfile=false openclaw@2026.5.27

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build and verify publishable native entry
        run: |
          npm run build
          node tests/ci/verify_package.mjs
          node tests/ci/verify_installed_package.mjs

  whatsapp-sdk:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - name: Install pinned plugin dependencies
        run: npx --yes pnpm@10.28.0 install --frozen-lockfile
      - name: Verify pinned SDK and current host
        run: |
          npx --yes pnpm@10.28.0 add --save-dev --lockfile=false openclaw@latest
          node tests/ci/verify_sdk.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tests/ci/verify_package.mjs

  # Contract suite + full typecheck against the LATEST OpenClaw host. This is
  # the lane that catches upstream interface drift (a moved plugin-sdk symbol,
  # a changed entry shape, a type break in the channel APIs) before it reaches
  # a user. Same suite the canary runs on a schedule; this is the per-PR gate.
  contract-pr:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Install pinned dependencies + latest OpenClaw host
        run: |
          npx --yes pnpm@10.28.0 install --frozen-lockfile
          npx --yes pnpm@10.28.0 add --save-dev --lockfile=false openclaw@latest
          node tests/ci/verify_sdk.mjs
          npm ls openclaw || true

      - name: Typecheck vs latest OpenClaw
        run: npm run typecheck

      - name: Contract tests vs latest OpenClaw
        run: npx vitest run tests/contract
