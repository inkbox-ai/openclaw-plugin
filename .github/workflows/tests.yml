name: PR checks — typecheck · unit · contract

on:
  push:
    branches: [main]
  pull_request:                     # catches PRs from feature branches → main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Offline unit suite + typecheck against the pinned OpenClaw host from
  # package-lock. Fast signal on our own code — cheap enough to run on every
  # push, including draft PRs (the heavy live suite is what we gate).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: inkbox-ai/inkbox
          ref: fdea6e55ac117f246624852aedeef0feabe08b9a
          path: .ci/inkbox

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefix .ci/inkbox/sdk/typescript
          npm run build --prefix .ci/inkbox/sdk/typescript
          npm install --no-save --package-lock=false \
            ./.ci/inkbox/sdk/typescript openclaw@2026.5.27

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  # Contract suite + full typecheck against the LATEST OpenClaw host. This is
  # the lane that catches upstream interface drift (a moved plugin-sdk symbol,
  # a changed entry shape, a type break in the channel APIs) before it reaches
  # a user. Same suite the canary runs on a schedule; this is the per-PR gate.
  contract-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: inkbox-ai/inkbox
          ref: fdea6e55ac117f246624852aedeef0feabe08b9a
          path: .ci/inkbox

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps + latest OpenClaw host
        run: |
          npm ci --prefix .ci/inkbox/sdk/typescript
          npm run build --prefix .ci/inkbox/sdk/typescript
          npm install --no-save --package-lock=false \
            ./.ci/inkbox/sdk/typescript openclaw@2026.5.27
          npm install --no-save --package-lock=false \
            ./.ci/inkbox/sdk/typescript openclaw@latest
          npm ls openclaw || true

      - name: Typecheck vs latest OpenClaw
        run: npm run typecheck

      - name: Contract tests vs latest OpenClaw
        run: npx vitest run tests/contract

  # Installs the way a user does: `openclaw plugins install git:<repo>`, with no
  # pre-build step. That path clones, runs `npm install`, and then refuses to
  # load the plugin unless compiled output exists — which every other job here
  # hides, because they all run `npm run build` first and then install from a
  # linked local path (where the host accepts TypeScript source). Nothing
  # exercised the real install until it broke in a user's hands.
  #
  # A bare clone of this checkout stands in for the remote: `git:file://...`
  # takes the identical code path in the host as `git:owner/repo`, without
  # needing the branch to exist anywhere public.
  git-install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # a bare clone cannot be made from a shallow one

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the OpenClaw host
        run: npm install -g openclaw@latest

      - name: Publish this commit as a bare repo
        run: git clone --bare "$GITHUB_WORKSPACE" /tmp/openclaw-plugin.git

      - name: Install the plugin from git (no pre-build)
        run: openclaw plugins install "git:file:///tmp/openclaw-plugin.git"

      - name: Confirm the host loaded it
        run: |
          openclaw plugins list | tee /tmp/plugins.txt
          grep -q inkbox /tmp/plugins.txt
