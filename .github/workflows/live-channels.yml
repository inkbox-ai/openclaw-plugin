name: Live — agent channels (email + SMS)

# Boots the agent-under-test (AUT) as a real OpenClaw gateway with the plugin, then
# a remote Inkbox identity emails it and waits for a reply. Two matrix legs:
#   mock — deterministic mock model; proves the pipe (no token spend).
#   real — real OpenAI key; proves the agent actually reasons (spends tokens).
# This suite is expensive (real gateway + tunnel + OpenAI tokens), so on PRs it runs
# only once the PR is READY (non-draft) — the job `if` gates on draft==false, and
# `ready_for_review` makes flipping a draft to ready fire it. Also runs on the 2x/day
# schedule; the repo-wide tunnel lock below serializes them all. Ephemeral runner:
# gateway + mock torn down on job end.
on:
  workflow_call:
    inputs:
      timeout_s:
        description: "Seconds to wait for the reply"
        required: false
        type: string
        default: "150"
      orchestrated:
        description: "True when the full-stack workflow owns the shared live lock"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      timeout_s:
        description: "Seconds to wait for the reply"
        default: "150"

permissions:
  contents: read

concurrency:
  # Only ONE client may hold the AUT's Inkbox tunnel at a time, so EVERY live tunnel
  # workflow (this + any future one) MUST use this exact group → they run one at a
  # time across all triggers (PRs + the main schedule queue behind each other).
  group: ${{ inputs.orchestrated && format('inkbox-live-child-{0}', github.run_id) || 'inkbox-live-aut-tunnel' }}
  cancel-in-progress: false
  queue: max

jobs:
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1          # legs share the AUT identity → must run one at a time
      matrix:
        mode: [mock, real]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: inkbox-ai/inkbox
          ref: fdea6e55ac117f246624852aedeef0feabe08b9a
          path: .ci/inkbox

      - name: Set up env paths (gateway log)
        run: echo "GATEWAY_LOG=$RUNNER_TEMP/gateway.log" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install live-test deps (Inkbox SDK + pytest)
        run: |
          pip install \
            "inkbox @ git+https://github.com/inkbox-ai/inkbox.git@fdea6e55ac117f246624852aedeef0feabe08b9a#subdirectory=sdk/python" \
            pytest

      - name: Build the plugin
        run: |
          npm ci --prefix .ci/inkbox/sdk/typescript
          npm run build --prefix .ci/inkbox/sdk/typescript
          npm install --no-save --package-lock=false \
            ./.ci/inkbox/sdk/typescript openclaw@2026.5.27
          npm run build

      - name: Install OpenClaw host
        run: |
          npm install -g openclaw@latest
          openclaw --version

      - name: Onboard model provider (${{ matrix.mode }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # --skip-health: onboard otherwise waits for a running gateway, and
          # ours starts in a later step.
          if [ "${{ matrix.mode }}" = "real" ]; then
            # Custom OpenAI-compatible provider pointed straight at OpenAI: the
            # model id goes through as-is with the real key — no aggregator.
            openclaw onboard --non-interactive \
              --auth-choice custom-api-key \
              --custom-base-url "https://api.openai.com/v1" \
              --custom-model-id "gpt-5.6-terra" \
              --custom-api-key "$OPENAI_API_KEY" \
              --custom-compatibility openai \
              --secret-input-mode plaintext \
              --skip-health \
              --accept-risk
          else
            # Same provider shape, but aimed at the local deterministic mock.
            openclaw onboard --non-interactive \
              --auth-choice custom-api-key \
              --custom-base-url "http://127.0.0.1:8088/v1" \
              --custom-model-id "mock-model" \
              --custom-api-key "sk-mock-not-used" \
              --custom-compatibility openai \
              --secret-input-mode plaintext \
              --skip-health \
              --accept-risk
          fi

      - name: Configure AUT identity + install plugin
        env:
          OPENCLAW_INKBOX_API_KEY: ${{ secrets.OPENCLAW_INKBOX_API_KEY }}
          OPENCLAW_INKBOX_SIGNING_KEY: ${{ secrets.OPENCLAW_INKBOX_SIGNING_KEY }}
        run: |
          HANDLE="$(python3 - <<'PYEOF'
          import os
          from inkbox import Inkbox
          c = Inkbox(api_key=os.environ["OPENCLAW_INKBOX_API_KEY"], base_url=os.environ.get("INKBOX_BASE_URL", "https://inkbox.ai"))
          print(c.mailboxes.list()[0].email_address.split("@", 1)[0])
          PYEOF
          )"
          echo "AUT handle: $HANDLE"
          # Install the plugin BEFORE writing channels.inkbox.* — the channel id
          # only validates once the plugin is registered.
          openclaw plugins install -l "$GITHUB_WORKSPACE"
          openclaw plugins enable inkbox || true
          openclaw config set channels.inkbox.enabled true --strict-json
          openclaw config set channels.inkbox.apiKey "$OPENCLAW_INKBOX_API_KEY"
          openclaw config set channels.inkbox.identity "$HANDLE"
          openclaw config set channels.inkbox.signingKey "$OPENCLAW_INKBOX_SIGNING_KEY"
          openclaw config set tools.allow '["inkbox"]' --strict-json
          # Onboarding defaults tools.profile to "coding", whose base allowlist
          # strips the inkbox messaging/contact/call tools. "full" = no restriction.
          openclaw config set tools.profile full
          openclaw plugins list --json | head -c 2000 || true

      - name: Start mock OpenAI model
        if: matrix.mode == 'mock'
        run: |
          nohup python3 "$GITHUB_WORKSPACE/tests/live/mock_openai.py" 8088 > "$RUNNER_TEMP/mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock.pid"
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8088/v1/models >/dev/null && { echo "mock model ready"; exit 0; }
            sleep 1
          done
          echo "::error::mock model did not start"; cat "$RUNNER_TEMP/mock.log"; exit 1

      - name: Start gateway and wait for readiness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          openclaw gateway run > "$GATEWAY_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/gateway.pid"
          echo "Waiting for the gateway to be ready (tunnel + webhooks)…"
          for i in $(seq 1 36); do      # up to ~180s
            if openclaw health --json 2>/dev/null | jq -e '.channels.inkbox as $c | ($c.connected == true) or ([$c.accounts[]?.connected] | any)' >/dev/null; then
              echo "Gateway ready."; exit 0
            fi
            sleep 5
          done
          echo "::error::gateway did not become ready"; cat "$GATEWAY_LOG"; exit 1

      - name: Run live test (${{ matrix.mode }})
        env:
          REMOTE_INKBOX_API_KEY: ${{ secrets.REMOTE_INKBOX_API_KEY }}
          OPENCLAW_INKBOX_API_KEY: ${{ secrets.OPENCLAW_INKBOX_API_KEY }}
          LIVE_EMAIL_TIMEOUT: ${{ inputs.timeout_s || '150' }}
          # The delivery-failure retry test forges a signed text.delivery_failed
          # webhook and POSTs it at the gateway's local webhook route. It needs
          # the AUT org's signing key (the same secret the gateway verifies
          # webhooks with) re-exported under an AUT_* name the test reads.
          AUT_INKBOX_SIGNING_KEY: ${{ secrets.OPENCLAW_INKBOX_SIGNING_KEY }}
          AUT_WEBHOOK_URL: http://127.0.0.1:18789/inkbox/webhook
        run: |
          if [ "${{ matrix.mode }}" = "real" ]; then
            LIVE_REAL_MODEL=1 python3 -m pytest tests/live -v
          else
            python3 -m pytest tests/live -v
          fi

      # Failure-only: these logs carry live phone/email/message content and this repo
      # (and its Action logs/artifacts) is public.
      - name: Dump logs (on failure only)
        if: failure()
        run: |
          echo "=== gateway.log ==="; cat "$GATEWAY_LOG" || true
          echo "=== mock model log ==="; cat "$RUNNER_TEMP/mock.log" 2>/dev/null || true
          echo "=== openclaw logs ==="; tail -n 200 /tmp/openclaw/openclaw-*.log 2>/dev/null || true

      - name: Tear down (always)
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/gateway.pid" 2>/dev/null)" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/mock.pid" 2>/dev/null)" 2>/dev/null || true

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-logs-${{ matrix.mode }}
          retention-days: 5
          path: |
            ${{ runner.temp }}/gateway.log
            ${{ runner.temp }}/mock.log
          if-no-files-found: ignore
