name: Live — Agent2Agent

# Real protocol legs cover both roles, conversation lengths, and worker progress:
# inbound/outbound × single-turn/multi-turn. The plugin and remote identities
# are preconfigured to allow one another in both directions.
on:
  workflow_call:
    inputs:
      timeout_s:
        description: "Seconds to wait for each A2A transition"
        required: false
        type: string
        default: "300"
      orchestrated:
        description: "True when the full-stack workflow owns the shared live lock"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      timeout_s:
        description: "Seconds to wait for each A2A transition"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ inputs.orchestrated && format('inkbox-live-child-{0}', github.run_id) || 'inkbox-live-aut-tunnel' }}
  cancel-in-progress: false
  queue: max

jobs:
  a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - inbound-single
          - inbound-multi
          - inbound-progress
          - outbound-single
          - outbound-multi

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install protocol driver
        run: pip install 'inkbox==0.5.9' pytest

      - name: Build plugin
        run: |
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" ci
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            @inkbox/sdk@0.5.9 openclaw@2026.5.27
          npm run build

      - name: Install OpenClaw
        run: |
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install -g openclaw@latest
          openclaw --version

      - name: Configure model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ matrix.scenario }}" = "inbound-progress" ]; then
            BASE_URL="http://127.0.0.1:8088/v1"
            MODEL_ID="mock-model"
            API_KEY="sk-mock-not-used"
          else
            BASE_URL="https://api.openai.com/v1"
            MODEL_ID="gpt-5.6-sol"
            API_KEY="$OPENAI_API_KEY"
          fi
          openclaw onboard --non-interactive \
            --auth-choice custom-api-key \
            --custom-base-url "$BASE_URL" \
            --custom-model-id "$MODEL_ID" \
            --custom-api-key "$API_KEY" \
            --custom-compatibility openai \
            --secret-input-mode plaintext \
            --skip-health \
            --accept-risk

      - name: Configure AUT identity and install plugin
        env:
          OPENCLAW_INKBOX_API_KEY: ${{ secrets.OPENCLAW_INKBOX_API_KEY }}
          OPENCLAW_INKBOX_SIGNING_KEY: ${{ secrets.OPENCLAW_INKBOX_SIGNING_KEY }}
        run: |
          HANDLE="$(python3 - <<'PY'
          import os
          from inkbox import Inkbox
          client = Inkbox(api_key=os.environ["OPENCLAW_INKBOX_API_KEY"])
          print(client.mailboxes.list()[0].email_address.split("@", 1)[0])
          PY
          )"
          openclaw plugins install -l --dangerously-force-unsafe-install "$GITHUB_WORKSPACE"
          openclaw plugins enable inkbox || true
          openclaw config set channels.inkbox.enabled true --strict-json
          openclaw config set channels.inkbox.apiKey "$OPENCLAW_INKBOX_API_KEY"
          openclaw config set channels.inkbox.identity "$HANDLE"
          openclaw config set channels.inkbox.voicemailDetection disabled
          openclaw config set channels.inkbox.a2aProgressIntervalSeconds 60 --strict-json
          openclaw config set channels.inkbox.signingKey "$OPENCLAW_INKBOX_SIGNING_KEY"
          openclaw config set tools.allow '["inkbox"]' --strict-json
          openclaw config set tools.profile full

      - name: Start deterministic progress model
        if: matrix.scenario == 'inbound-progress'
        env:
          MOCK_A2A_SCENARIO: inbound-progress
        run: |
          nohup python3 "$GITHUB_WORKSPACE/tests/live/mock_openai.py" 8088 > "$RUNNER_TEMP/mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock.pid"
          for _ in $(seq 1 10); do
            curl -sf --connect-timeout 1 --max-time 3 http://127.0.0.1:8088/v1/models >/dev/null && exit 0
            sleep 1
          done
          echo "::error::deterministic progress model did not start"
          exit 1

      - name: Start gateway
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          openclaw gateway run > "$RUNNER_TEMP/gateway.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/gateway.pid"
          for _ in $(seq 1 36); do
            if openclaw health --json 2>/dev/null | jq -e \
              '.channels.inkbox as $c | ($c.connected == true) or ([$c.accounts[]?.connected] | any)' \
              >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/gateway.pid")" 2>/dev/null; then
              echo "::error::gateway exited during startup"
              exit 1
            fi
            sleep 5
          done
          echo "::error::gateway did not become ready"
          exit 1

      - name: Run ${{ matrix.scenario }}
        env:
          A2A_SCENARIO: ${{ matrix.scenario }}
          A2A_TIMEOUT_S: ${{ inputs.timeout_s || '300' }}
          AUT_INKBOX_API_KEY: ${{ secrets.OPENCLAW_INKBOX_API_KEY }}
          REMOTE_INKBOX_API_KEY: ${{ secrets.REMOTE_INKBOX_API_KEY }}
        run: |
          python3 -m pytest tests/live/test_a2a_helpers.py -q
          python3 tests/live/a2a_driver.py

      - name: Report content-free failure state
        if: failure()
        run: |
          if kill -0 "$(cat "$RUNNER_TEMP/gateway.pid" 2>/dev/null)" 2>/dev/null; then
            echo "gateway_process=running"
          else
            echo "gateway_process=stopped"
          fi
          test -s "$RUNNER_TEMP/gateway.log" && echo "gateway_log=present" || echo "gateway_log=empty"

      - name: Stop gateway
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/gateway.pid" 2>/dev/null)" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/mock.pid" 2>/dev/null)" 2>/dev/null || true
