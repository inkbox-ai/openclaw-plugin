name: Canary — plugin vs OpenClaw latest

# OpenClaw ships new releases constantly, so the host can break us even when we
# don't push. Run the host-interface contract tests (plus a full typecheck)
# against the latest published OpenClaw twice a day and post one Google Chat
# message on failure. The live channel suite chains off this run, so the canary
# leads and live follows on the same cadence.
on:
  schedule:
    # 2x/day at 7 AM and 7 PM America/Los_Angeles (PDT/UTC-7 basis; cron is UTC).
    - cron: "13 14 * * *"   # 07:00 PT
    - cron: "13 2 * * *"    # 19:00 PT
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: inkbox-ai/inkbox
          ref: a4dd76b534e33c0a8352148d8f0e9ab25199f05b
          path: .ci/inkbox

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps + latest OpenClaw host
        run: |
          npm ci --prefix .ci/inkbox/sdk/typescript
          npm run build --prefix .ci/inkbox/sdk/typescript
          npm install --no-save --package-lock=false \
            ./.ci/inkbox/sdk/typescript openclaw@latest
          npm ls openclaw || true

      - name: Typecheck vs latest OpenClaw
        run: npm run typecheck

      - name: Complete offline suite vs latest OpenClaw
        run: npm test

  notify:
    needs: canary
    if: always() && github.event_name == 'schedule' && needs.canary.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify Google Chat on scheduled failure
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          [ -n "$WEBHOOK_URL" ] || { echo "GOOGLE_CHAT_WEBHOOK_URL is missing"; exit 1; }
          curl --fail-with-body --retry 3 --retry-all-errors --max-time 20 \
            -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"🚨 openclaw-plugin canary FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK_URL"
