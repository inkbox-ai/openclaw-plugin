name: Canary — plugin vs OpenClaw latest

# OpenClaw ships new releases constantly, so the host can break us even when we
# don't push. Run the host-interface contract tests (plus a full typecheck)
# against the latest published host before full-stack suites.
on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Install deps + latest OpenClaw host
        run: |
          npx --yes pnpm@10.28.0 install --frozen-lockfile
          npx --yes pnpm@10.28.0 add --save-dev --lockfile=false openclaw@latest
          node tests/ci/verify_sdk.mjs
          npm ls openclaw || true

      - name: Typecheck vs latest OpenClaw
        run: npm run typecheck

      - name: Complete offline suite vs latest OpenClaw
        run: npm test
